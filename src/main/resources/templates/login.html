<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <style>
        form { border:1px solid #ccc; padding:20px; border-radius:8px; }
        .form-group { margin-bottom:15px; }
        label { display:block; margin-bottom:5px; }
        input { width:300px; padding:8px; }
        button { width:100%; padding:10px; background:#007bff; color:#fff; border:none; border-radius:4px; cursor:pointer; }
        #message { margin-top: 10px; }
    </style>
</head>
<body style="font-family: sans-serif;">

<!-- 공통 헤더 삽입 -->
<div th:replace="~{fragments/header :: header}"></div>

<main style="display:flex; justify-content:center; align-items:center; flex-direction:column; padding: 20px; padding-top: 10px;">
    <h1>로그인</h1>
    <form id="login-form">
        <div class="form-group">
            <label for="email">이메일:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">비밀번호:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">로그인</button>
    </form>
    <p id="message"></p>
</main>

<script>
    // Login form submission handler
    const AUTH_BASE = '/api/auth';
    const loginForm = document.getElementById('login-form');
    if (loginForm) {
        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('message');

            try {
                const res = await fetch(`${AUTH_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (!res.ok) {
                    const text = await res.text().catch(()=>'');
                    if (res.status === 401) {
                        messageEl.textContent = '로그인 실패(401): 이메일/비밀번호를 확인하세요.';
                    } else if (res.status === 403) {
                        messageEl.textContent = '접근 거부(403): 이메일 인증이 필요하거나 권한이 없습니다.';
                    } else {
                        messageEl.textContent = `오류(${res.status}): ${text || '로그인 중 문제가 발생했습니다.'}`;
                    }
                    messageEl.style.color = 'red';
                    return;
                }

                const { accessToken, refreshToken } = await res.json();
                if (!accessToken || !refreshToken) {
                    messageEl.textContent = '토큰이 없습니다. 관리자에게 문의하세요.';
                    messageEl.style.color = 'red';
                    return;
                }

                localStorage.setItem('accessToken', accessToken);
                localStorage.setItem('refreshToken', refreshToken);

                messageEl.textContent = '로그인 성공! 게시판으로 이동합니다.';
                messageEl.style.color = 'green';
                setTimeout(()=> { window.location.href = '/board/list'; }, 300);
            } catch (err) {
                console.error(err);
                messageEl.textContent = '네트워크 오류가 발생했습니다.';
                messageEl.style.color = 'red';
            }
        });
    }

    // Header auth links handler
    const TOKEN_KEY = 'accessToken';
    const token = localStorage.getItem(TOKEN_KEY);
    const authLinks = document.getElementById('authLinks');
    if (token && authLinks) {
        authLinks.innerHTML = `
            <a href="/profile" style="margin-right: 10px;">내 정보</a>
            <a href="#" id="logoutBtn">로그아웃</a>
        `;
    }

    // Logout click handler
    document.addEventListener('click', (e) => {
        if (e.target && e.target.id === 'logoutBtn') {
            e.preventDefault();
            localStorage.removeItem(TOKEN_KEY);
            location.reload();
        }
    });
</script>
</body>
</html>
