<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <style>
        body { font-family: sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column; }
        form { border:1px solid #ccc; padding:20px; border-radius:8px; }
        .form-group { margin-bottom:15px; }
        label { display:block; margin-bottom:5px; }
        input { width:300px; padding:8px; }
        button { width:100%; padding:10px; background:#007bff; color:#fff; border:none; border-radius:4px; cursor:pointer; }
        #message { margin-top: 10px; }
    </style>
</head>
<body>

<h1>로그인</h1>
<form id="login-form">
    <div class="form-group">
        <label for="email">이메일:</label>
        <input type="email" id="email" name="email" required>
    </div>
    <div class="form-group">
        <label for="password">비밀번호:</label>
        <input type="password" id="password" name="password" required>
    </div>
    <button type="submit">로그인</button>
</form>
<p id="message"></p>

<script>
    const AUTH_BASE = '/api/auth'; // ← 백엔드 경로 통일

    document.getElementById('login-form').addEventListener('submit', async (event) => {
        event.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const messageEl = document.getElementById('message');

        try {
            const res = await fetch(`${AUTH_BASE}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (!res.ok) {
                const text = await res.text().catch(()=>'');
                if (res.status === 401) {
                    messageEl.textContent = '로그인 실패(401): 이메일/비밀번호를 확인하세요.';
                } else if (res.status === 403) {
                    messageEl.textContent = '접근 거부(403): 이메일 인증이 필요하거나 권한이 없습니다.';
                } else {
                    messageEl.textContent = `오류(${res.status}): ${text || '로그인 중 문제가 발생했습니다.'}`;
                }
                messageEl.style.color = 'red';
                return;
            }

            const { accessToken, refreshToken } = await res.json();
            if (!accessToken || !refreshToken) {
                messageEl.textContent = '토큰이 없습니다. 관리자에게 문의하세요.';
                messageEl.style.color = 'red';
                return;
            }

            localStorage.setItem('accessToken', accessToken);
            localStorage.setItem('refreshToken', refreshToken);

            messageEl.textContent = '로그인 성공! 게시판으로 이동합니다.';
            messageEl.style.color = 'green';
            // 잠깐 보여주고 이동
            setTimeout(()=> { window.location.href = '/board/list'; }, 300);
        } catch (err) {
            console.error(err);
            messageEl.textContent = '네트워크 오류가 발생했습니다.';
            messageEl.style.color = 'red';
        }
    });
</script>
</body>
</html>
