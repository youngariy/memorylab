<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>내 정보</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; }
        main { padding: 10px 24px 24px 24px; }
        .card { border:1px solid #e5e7eb; border-radius: 12px; padding: 16px; max-width: 960px; box-sizing: border-box; }
        .row  { display: grid; grid-template-columns: 120px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid #f3f4f6; align-items: center; }
        .row:last-child { border-bottom: 0; }
        .label { color:#6b7280; }
        .meta { color:#6b7280; font-size:12px; margin-top:8px; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
            table-layout: fixed;
        }
        th, td {
            border-bottom: 1px solid #eee;
            padding: 8px;
            text-align: left;
            vertical-align: top;
        }
        td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        th:nth-child(2), td:nth-child(2) {
            width: 50%;
        }

        .title-line {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .title-line a {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-grow: 1;
        }
        .title-line .icons, .title-line .pills {
            white-space: nowrap;
            flex-shrink: 0;
        }

        th { background: #fafafa; }
        .pill { padding: 2px 8px; border:1px solid #ddd; border-radius: 999px; font-size: 12px; margin-left: 4px; }
        .pill.private { border-color:#ef4444; color:#ef4444; }
        
        .admin-badge {
            display: inline-block;
            margin-left: 8px;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            background-color: #ef4444;
            border-radius: 999px;
            vertical-align: middle;
        }

        .notice-row {
            background-color: #fefce8;
        }
        .notice-row td:first-child {
            font-weight: bold;
            color: #ca8a04;
        }
    </style>
</head>
<body>

<!-- 공통 헤더 삽입 -->
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1>내 정보</h1>
    <div id="status" class="meta">불러오는 중...</div>

    <section id="profileCard" class="card" style="display:none;">
        <div class="row"><div class="label">닉네임</div><div id="f-nickname">-</div></div>
        <div class="row"><div class="label">이름</div><div id="f-name">-</div></div>
        <div class="row"><div class="label">이메일</div><div id="f-email">-</div></div>
        <div class="row"><div class="label">가입일</div><div id="f-createdAt">-</div></div>
    </section>

    <h2 style="margin-top:20px;">내가 쓴 글</h2>
    <div id="postsWrap" class="card" style="display:none;">
        <table>
            <thead>
            <tr>
                <th style="width:72px;">번호</th>
                <th>제목</th>
                <th style="width:120px;">카테고리</th>
                <th style="width:90px;">조회</th>
                <th style="width:180px;">작성일</th>
            </tr>
            </thead>
            <tbody id="postsBody"><tr><td colspan="5" class="meta">불러오는 중...</td></tr></tbody>
        </table>
        <div id="postsPager" class="meta"></div>
    </div>
</main>

<script>
    // === 개선된 공용 스크립트 ===
    const accessTokenKey = 'accessToken', refreshTokenKey = 'refreshToken';
    const getAccessToken = () => localStorage.getItem(accessTokenKey);
    const logout = () => { localStorage.removeItem(accessTokenKey); localStorage.removeItem(refreshTokenKey); alert('세션이 만료되었습니다. 다시 로그인해 주세요.'); location.href = '/login'; };
    let isRefreshing = false, refreshSubscribers = [];
    const onRefreshed = (t) => { refreshSubscribers.forEach(c => c(t)); refreshSubscribers = []; };
    const addRefreshSubscriber = (c) => { refreshSubscribers.push(c); };
    async function refreshAccessToken() { isRefreshing = true; try { const rt = localStorage.getItem(refreshTokenKey); if (!rt) { logout(); return Promise.reject(new Error('No refresh token')); } const res = await fetch('/api/auth/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refreshToken: rt }) }); if (!res.ok) { logout(); return Promise.reject(new Error('Failed to refresh token')); } const { accessToken: newAccessToken } = await res.json(); localStorage.setItem(accessTokenKey, newAccessToken); isRefreshing = false; onRefreshed(newAccessToken); return newAccessToken; } catch (e) { isRefreshing = false; logout(); return Promise.reject(e); } }
    async function api(path, options = {}) { const makeRequest = async (token) => { const { method = 'GET', headers = {}, body } = options; const h = { ...headers }; if (body && !('Content-Type' in h)) h['Content-Type'] = 'application/json'; if (token) h['Authorization'] = 'Bearer ' + token; return fetch(path, { method, headers: h, body }); }; let res = await makeRequest(getAccessToken()); if (res.status === 401) { if (!isRefreshing) { try { const newAccessToken = await refreshAccessToken(); res = await makeRequest(newAccessToken); } catch (error) { throw new Error('Session expired.'); } } else { res = await new Promise((resolve) => { addRefreshSubscriber(async (newAccessToken) => { resolve(await makeRequest(newAccessToken)); }); }); } } if (!res.ok) { let msg = `${res.status} ${res.statusText}`; try { const ct = res.headers.get('content-type') || ''; if (ct.includes('application/json')) { const j = await res.json(); if (j && (j.message || j.error)) msg += `: ${j.message || j.error}`; } else { const t = await res.text(); if (t) msg += `: ${t}`; } } catch {} throw new Error(msg); } const ct = res.headers.get('content-type') || ''; return ct.includes('application/json') ? res.json() : null; }
    
    (function headerToggle(){
        const t = getAccessToken();
        const auth = document.getElementById('authLinks');
        if (auth) {
            if (t) {
                auth.innerHTML = `<a href="/profile" style="margin-right: 10px;">내 정보</a><a href="#" id="logoutBtn">로그아웃</a>`;
            } else {
                auth.innerHTML = `<a href="/login" style="margin-right: 10px;">로그인</a><a href="/signup">회원가입</a>`;
            }
        }
        document.addEventListener('click', (e) => {
            if (e.target && e.target.id === 'logoutBtn') {
                e.preventDefault();
                localStorage.removeItem(accessTokenKey);
                localStorage.removeItem(refreshTokenKey);
                location.href = '/';
            }
        });
    })();
    
    if (!getAccessToken()) { alert('로그인이 필요합니다.'); location.href = '/login'; }

    // === 페이지 고유 스크립트 ===
    const fmt = (iso) => iso ? new Date(iso).toLocaleString('ko-KR') : '-';
    const escapeHtml = (s)=> (s==null?'':String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;'));
    let myId = null;

    async function loadProfile() {
        const status = document.getElementById('status');
        const card   = document.getElementById('profileCard');
        try {
            const me = await api('/api/auth/me');
            myId = me.id ?? null;

            const nicknameEl = document.getElementById('f-nickname');
            nicknameEl.textContent = me.nickname ?? '-';

            if (Array.isArray(me.roles) && me.roles.includes('ROLE_ADMIN')) {
                const badge = document.createElement('span');
                badge.className = 'admin-badge';
                badge.textContent = '👑 관리자';
                nicknameEl.appendChild(badge);
            }

            document.getElementById('f-name').textContent     = me.name ?? '-';
            document.getElementById('f-email').textContent    = me.email ?? '-';
            document.getElementById('f-createdAt').textContent= fmt(me.createdAt);
            status.textContent = '완료';
            card.style.display = '';
        } catch (err) {
            status.textContent = '오류: ' + (err?.message || err);
            console.error(err);
        }
    }

    async function loadMyPosts(page=0, size=10) {
        const wrap  = document.getElementById('postsWrap');
        const body  = document.getElementById('postsBody');
        const pager = document.getElementById('postsPager');
        body.innerHTML = `<tr><td colspan="5" class="meta">불러오는 중...</td></tr>`;
        pager.textContent = '';
        if (!myId) { wrap.style.display='none'; return; }

        try {
            const url = new URL('/api/board/me', location.origin);
            url.searchParams.set('page', page);
            url.searchParams.set('size', size);

            const data = await api(url.toString());
            const items = Array.isArray(data.content) ? data.content : [];
            const total    = parseInt(data.totalElements ?? 0, 10) || 0;
            const curPage  = parseInt(data.number ?? page, 10) || 0;
            const pageSize = parseInt(data.size ?? size, 10)   || size;
            const pageStartNo = total ? (total - (curPage * pageSize)) : (curPage * pageSize + 1);

            if (items.length === 0) {
                body.innerHTML = `<tr><td colspan="5" class="meta">작성한 게시글이 없습니다.</td></tr>`;
            } else {
                body.innerHTML = items.map((it, idx) => {
                    const isNotice = it.category === 'NOTICE';
                    const rowClass = isNotice ? 'notice-row' : '';
                    const displayNo = isNotice ? '*' : (pageStartNo - idx);

                    const id        = it.id;
                    const title     = escapeHtml(it.title);
                    const category  = escapeHtml(it.category || '');
                    const vis       = String(it.visibility || '').toUpperCase();
                    const views     = (typeof it.viewCount === 'number') ? it.viewCount : (it.viewCount || 0);
                    const createdAt = fmt(it.createdAt);

                    let videoIcon = '';
                    if (it.conversionStatus === 'COMPLETED') {
                        videoIcon = ' 🎥';
                    } else if (it.conversionStatus === 'PROCESSING' || it.conversionStatus === 'UPLOADED') {
                        videoIcon = ' ⏳';
                    }

                    const privatePill = vis === 'PRIVATE' ? `<span class="pill private">나만보기</span>` : '';

                    return `
            <tr class="${rowClass}">
              <td>${displayNo}</td>
              <td class="title-cell">
                <div class="title-line">
                    <a href="/board/view?id=${encodeURIComponent(id)}" title="${title}">${title}</a>
                    <span class="icons">${videoIcon}</span>
                    <span class="pills">${privatePill}</span>
                </div>
              </td>
              <td>${category || '-'}</td>
              <td>${views}</td>
              <td>${createdAt}</td>
            </tr>`;
                }).join('');
            }

            const totalPages = Math.max(1, parseInt(data.totalPages ?? 1, 10) || 1);
            pager.textContent = `페이지 ${ (curPage+1) } / ${ totalPages } (총 ${ total }건)`;
            wrap.style.display = '';

        } catch (err) {
            body.innerHTML = `<tr><td colspan="5" class="meta">오류: ${escapeHtml(err.message || err)}</td></tr>`;
            console.error(err);
        }
    }

    document.addEventListener('DOMContentLoaded', async ()=> {
        await loadProfile();
        await loadMyPosts(0, 10);
    });
</script>

</body>
</html>
