<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <style>
        body { font-family: sans-serif; background-color: #f8f9fa; margin: 0; }
        main { display: flex; justify-content: center; align-items: center; flex-direction: column; padding: 20px; }
        .signup-container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 400px; }
        h1 { text-align: center; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        .input-group { display: flex; gap: 8px; }
        input { flex-grow: 1; width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn-check { background-color: #6c757d; color: white; white-space: nowrap; }
        .btn-send { width: 100%; background-color: #007bff; color: white; }
        .btn-submit { width: 100%; padding: 12px; background-color: #28a745; color: white; font-size: 16px; }
        .btn:disabled { background-color: #e9ecef; color: #6c757d; cursor: not-allowed; }
        .feedback { font-size: 12px; margin-top: 4px; min-height: 1em; }
        .feedback.success { color: #28a745; }
        .feedback.error { color: #dc3545; }
        #email-verification-section { display: none; }
    </style>
</head>
<body>

<!-- 공통 헤더 삽입 -->
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <div class="signup-container">
        <h1>회원가입</h1>
        <form id="signup-form" novalidate>
            <!-- 이메일 -->
            <div class="form-group">
                <label for="email">이메일</label>
                <div class="input-group">
                    <input type="email" id="email" required>
                    <button type="button" id="check-email-btn" class="btn btn-check">중복 확인</button>
                </div>
                <div id="email-feedback" class="feedback"></div>
            </div>

            <!-- 닉네임 -->
            <div class="form-group">
                <label for="nickname">닉네임</label>
                <div class="input-group">
                    <input type="text" id="nickname" required>
                    <button type="button" id="check-nickname-btn" class="btn btn-check">중복 확인</button>
                </div>
                <div id="nickname-feedback" class="feedback"></div>
            </div>

            <!-- 이름 -->
            <div class="form-group">
                <label for="name">이름</label>
                <input type="text" id="name" required>
            </div>

            <!-- 비밀번호 -->
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" required>
            </div>

            <!-- 비밀번호 확인 -->
            <div class="form-group">
                <label for="password-confirm">비밀번호 확인</label>
                <input type="password" id="password-confirm" required>
                <div id="password-feedback" class="feedback"></div>
            </div>

            <!-- 이메일 인증 섹션 -->
            <div class="form-group" id="email-verification-section">
                <button type="button" id="send-code-btn" class="btn btn-send" disabled>인증번호 발송</button>
                <div class="input-group" id="code-input-group" style="display:none; margin-top: 10px;">
                    <input type="text" id="verification-code" placeholder="인증번호 6자리">
                    <span id="timer" style="align-self: center; margin: 0 10px; font-weight: bold;">5:00</span>
                    <button type="button" id="verify-code-btn" class="btn btn-check">인증 확인</button>
                </div>
                <div id="verification-feedback" class="feedback"></div>
            </div>

            <!-- 최종 제출 -->
            <button type="submit" id="submit-btn" class="btn btn-submit" disabled>회원가입</button>
        </form>
    </div>
</main>

<script>
    // --- Signup form script ---
    const $ = (selector) => document.querySelector(selector);
    const emailInput = $('#email'), nicknameInput = $('#nickname');
    const passwordInput = $('#password'), passwordConfirmInput = $('#password-confirm');
    const checkEmailBtn = $('#check-email-btn'), checkNicknameBtn = $('#check-nickname-btn');
    const sendCodeBtn = $('#send-code-btn'), verifyCodeBtn = $('#verify-code-btn');
    const submitBtn = $('#submit-btn');
    const emailFeedback = $('#email-feedback'), nicknameFeedback = $('#nickname-feedback'), passwordFeedback = $('#password-feedback'), verificationFeedback = $('#verification-feedback');
    const emailVerificationSection = $('#email-verification-section'), codeInputGroup = $('#code-input-group');
    const timerEl = $('#timer');

    let timerInterval;
    const validationState = {
        emailAvailable: false,
        nicknameAvailable: false,
        passwordMatch: false,
        emailVerified: false,
        isEmail(email) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }
    };

    function updateSubmitButtonState() {
        const { emailAvailable, nicknameAvailable, passwordMatch, emailVerified } = validationState;
        submitBtn.disabled = !(emailAvailable && nicknameAvailable && passwordMatch && emailVerified);
    }

    function setFeedback(element, message, isSuccess) {
        element.textContent = message;
        element.className = 'feedback ' + (isSuccess ? 'success' : 'error');
    }

    emailInput.addEventListener('input', () => {
        validationState.emailAvailable = false;
        validationState.emailVerified = false;
        emailVerificationSection.style.display = 'none';
        sendCodeBtn.disabled = true;
        setFeedback(emailFeedback, '', true);
        updateSubmitButtonState();
    });
    nicknameInput.addEventListener('input', () => {
        validationState.nicknameAvailable = false;
        setFeedback(nicknameFeedback, '', true);
        updateSubmitButtonState();
    });

    [passwordInput, passwordConfirmInput].forEach(input => {
        input.addEventListener('input', () => {
            const pw = passwordInput.value;
            const pwc = passwordConfirmInput.value;
            if (pw && pwc) {
                if (pw === pwc) {
                    setFeedback(passwordFeedback, '비밀번호가 일치합니다.', true);
                    validationState.passwordMatch = true;
                } else {
                    setFeedback(passwordFeedback, '비밀번호가 일치하지 않습니다.', false);
                    validationState.passwordMatch = false;
                }
            } else {
                validationState.passwordMatch = false;
            }
            updateSubmitButtonState();
        });
    });

    checkEmailBtn.addEventListener('click', async () => {
        const email = emailInput.value.trim();
        if (!validationState.isEmail(email)) {
            setFeedback(emailFeedback, '유효한 이메일 형식이 아닙니다.', false);
            return;
        }
        try {
            const res = await fetch(`/api/auth/check-email?email=${encodeURIComponent(email)}`);
            if (!res.ok) {
                let errorMsg = '이미 사용 중인 이메일입니다.';
                try { const errorBody = await res.json(); errorMsg = errorBody.message || errorMsg; } catch(e){}
                throw new Error(errorMsg);
            }
            setFeedback(emailFeedback, '사용 가능한 이메일입니다.', true);
            validationState.emailAvailable = true;
            emailVerificationSection.style.display = 'block';
            sendCodeBtn.disabled = false;
        } catch (err) {
            setFeedback(emailFeedback, err.message, false);
            validationState.emailAvailable = false;
        }
        updateSubmitButtonState();
    });

    checkNicknameBtn.addEventListener('click', async () => {
        const nickname = nicknameInput.value.trim();
        if (!nickname) {
            setFeedback(nicknameFeedback, '닉네임을 입력해주세요.', false);
            return;
        }
        try {
            const res = await fetch(`/api/auth/check-nickname?nickname=${encodeURIComponent(nickname)}`);
            if (!res.ok) {
                let errorMsg = '이미 사용 중인 닉네임입니다.';
                try { const errorBody = await res.json(); errorMsg = errorBody.message || errorMsg; } catch(e){}
                throw new Error(errorMsg);
            }
            setFeedback(nicknameFeedback, '사용 가능한 닉네임입니다.', true);
            validationState.nicknameAvailable = true;
        } catch (err) {
            setFeedback(nicknameFeedback, err.message, false);
            validationState.nicknameAvailable = false;
        }
        updateSubmitButtonState();
    });

    sendCodeBtn.addEventListener('click', async () => {
        sendCodeBtn.disabled = true;
        sendCodeBtn.textContent = '전송 중...';
        try {
            const res = await fetch('/api/auth/send-verification-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: emailInput.value })
            });
            if (!res.ok) { throw new Error('인증번호 발송에 실패했습니다.'); }
            setFeedback(verificationFeedback, '인증번호가 발송되었습니다. 5분 내에 입력해주세요.', true);
            codeInputGroup.style.display = 'flex';
            startTimer(300);
        } catch (err) {
            setFeedback(verificationFeedback, err.message, false);
            sendCodeBtn.disabled = false;
        } finally {
            sendCodeBtn.textContent = '인증번호 재전송';
        }
    });

    verifyCodeBtn.addEventListener('click', async () => {
        const email = emailInput.value;
        const code = $('#verification-code').value;
        try {
            const res = await fetch('/api/auth/verify-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, code })
            });
            if (!res.ok) { throw new Error('인증 코드가 일치하지 않습니다.'); }
            setFeedback(verificationFeedback, '이메일 인증이 완료되었습니다.', true);
            validationState.emailVerified = true;
            clearInterval(timerInterval);
            timerEl.textContent = '인증 완료';
            emailInput.disabled = true;
            checkEmailBtn.disabled = true;
            sendCodeBtn.disabled = true;
            $('#verification-code').disabled = true;
            verifyCodeBtn.disabled = true;
        } catch (err) {
            setFeedback(verificationFeedback, err.message, false);
            validationState.emailVerified = false;
        }
        updateSubmitButtonState();
    });

    function startTimer(duration) {
        let timer = duration, minutes, seconds;
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            minutes = parseInt(timer / 60, 10);
            seconds = parseInt(timer % 60, 10);
            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;
            timerEl.textContent = minutes + ":" + seconds;
            if (--timer < 0) {
                clearInterval(timerInterval);
                timerEl.textContent = "만료";
                setFeedback(verificationFeedback, '인증 시간이 만료되었습니다. 인증번호를 다시 발송해주세요.', false);
                sendCodeBtn.disabled = false;
            }
        }, 1000);
    }

    $('#signup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!submitBtn.disabled) {
            const body = {
                email: emailInput.value,
                nickname: nicknameInput.value,
                name: $('#name').value,
                password: passwordInput.value
            };
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (!res.ok) {
                    let errorMsg = '회원가입에 실패했습니다.';
                    try { const errorBody = await res.json(); errorMsg = errorBody.message || errorMsg; } catch(e){}
                    throw new Error(errorMsg);
                }
                alert('회원가입이 성공적으로 완료되었습니다! 로그인 페이지로 이동합니다.');
                window.location.href = '/login';
            } catch (err) {
                alert('회원가입 중 오류가 발생했습니다: ' + err.message);
            }
        }
    });

    // --- Header auth links script ---
    const TOKEN_KEY = 'accessToken';
    const token = localStorage.getItem(TOKEN_KEY);
    const authLinks = document.getElementById('authLinks');
    if (token && authLinks) {
        authLinks.innerHTML = `
            <a href="/profile" style="margin-right: 10px;">내 정보</a>
            <a href="#" id="logoutBtn">로그아웃</a>
        `;
    }

    document.addEventListener('click', (e) => {
        if (e.target && e.target.id === 'logoutBtn') {
            e.preventDefault();
            localStorage.removeItem(TOKEN_KEY);
            location.reload();
        }
    });
</script>
</body>
</html>
