<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; }
        form { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 300px; padding: 8px; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<h1>회원가입</h1>
<form id="signup-form">
    <div class="form-group">
        <label for="username">사용자 이름:</label>
        <input type="text" id="username" name="username" required>
    </div>
    <div class="form-group">
        <label for="email">이메일:</label>
        <input type="email" id="email" name="email" required>
    </div>
    <div class="form-group">
        <label for="password">비밀번호:</label>
        <input type="password" id="password" name="password" required>
    </div>
    <button type="submit">가입하기</button>
</form>
<p id="message"></p>

<script>
    document.getElementById('signup-form').addEventListener('submit', async function(event) {
        event.preventDefault(); // 기본 제출 동작 방지

        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const messageEl = document.getElementById('message');

        // 서버로 보낼 JSON 데이터 생성
        const data = {
            username: username,
            email: email,
            password: password
        };

        try {
            // /auth/register 엔드포인트로 데이터 전송
            const response = await fetch('/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                messageEl.textContent = '회원가입 성공! 이메일을 확인하여 계정을 활성화해주세요.';
                messageEl.style.color = 'green';
            } else {
                const errorData = await response.json(); // 서버에서 오는 에러 메시지
                messageEl.textContent = '회원가입 실패: ' + (errorData.message || '입력값을 확인하세요.');
                messageEl.style.color = 'red';
            }
        } catch (error) {
            console.error('Error:', error);
            messageEl.textContent = '오류가 발생했습니다.';
            messageEl.style.color = 'red';
        }
    });
</script>
</body>
</html>
