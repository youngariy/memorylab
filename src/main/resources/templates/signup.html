<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; }
        form { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 300px; padding: 8px; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<h1>회원가입</h1>
<form id="signup-form">
    <div class="form-group">
        <label for="nickname">닉네임:</label>
        <input type="text" id="nickname" required>
    </div>
    <div class="form-group">
        <label for="name">이름:</label>
        <input type="text" id="name" required>
    </div>
    <div class="form-group">
        <label for="email">이메일:</label>
        <input type="email" id="email" required>
    </div>
    <div class="form-group">
        <label for="password">비밀번호:</label>
        <input type="password" id="password" required>
    </div>
    <button type="submit">가입하기</button>
</form>
<p id="message"></p>

<script>
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = {
            nickname: document.getElementById('nickname').value,
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };
        const msg = document.getElementById('message');

        try {
            const res = await fetch('/auth/register', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify(body)
            });
            if (res.ok) {
                msg.textContent = '회원가입 성공! 이메일 인증 메일을 확인하세요.';
                msg.style.color = 'green';
            } else {
                // 서버가 text/plain으로 에러를 주는 경우 대비
                let errText;
                try { errText = (await res.json()).message; } catch { errText = await res.text(); }
                msg.textContent = '회원가입 실패: ' + (errText || '입력값을 확인하세요.');
                msg.style.color = 'red';
            }
        } catch (err) {
            console.error(err);
            msg.textContent = '오류가 발생했습니다.';
            msg.style.color = 'red';
        }
    });
</script>
</body>
</html>
