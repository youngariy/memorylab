<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>새 글 작성</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        body { font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif; margin: 0; }
        main { padding: 10px 24px 24px; max-width: 900px; margin: 0 auto; }
        input, select, textarea { width:100%; padding:8px; border:1px solid #e5e7eb; border-radius:8px; box-sizing: border-box; font-size: 16px; }
        textarea { min-height: 180px; }
        .row { margin-bottom: 16px; }
        .actions { display:flex; gap:10px; align-items:center; }
        label { display: block; margin-bottom: 4px; font-weight: 500; }

        /* === 동영상 업로드 UI 스타일 === */
        #dropzone {
            border: 2px dashed #e5e7eb;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            color: #6b7280;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }
        #dropzone.active {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        #fileInput { display: none; }
        #fileInfo { margin-top: 16px; font-size: 14px; color: #374151; }
        #progress-container {
            width: 100%;
            background-color: #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 8px;
            display: none; /* 평소엔 숨김 */
        }
        #progress-bar {
            width: 0%;
            height: 16px;
            background-color: #3b82f6;
            text-align: center;
            line-height: 16px;
            color: white;
            font-size: 12px;
            transition: width 0.2s;
        }
    </style>
</head>
<body>

<!-- 공통 헤더 삽입 -->
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1>새 글 작성</h1>

    <form id="f" novalidate>
        <!-- === 동영상 업로드 UI === -->
        <div class="row">
            <label>동영상 (선택)</label>
            <div id="dropzone">
                <input type="file" id="fileInput" accept="video/mp4" />
                <p>여기에 MP4 파일을 드래그 앤 드롭하거나, 클릭하여 파일을 선택하세요.</p>
                <small>(최대 500MB)</small>
            </div>
            <div id="fileInfo"></div>
            <div id="progress-container">
                <div id="progress-bar">0%</div>
            </div>
        </div>

        <div class="row">
            <label for="title">제목</label>
            <input id="title" name="title" placeholder="제목을 입력하세요" maxlength="120" required />
        </div>

        <div class="row">
            <label for="tags">태그</label>
            <input id="tags" name="tags" placeholder="쉼표(,)로 구분하여 태그를 입력하세요 (예: 3D모델, 메타버스)" />
        </div>

        <div class="row">
            <label for="category">분류</label>
            <select id="category" name="category" required>
                <option value="NOTICE">공지</option>
                <option value="FREE" selected>자유</option>
                <option value="QNA">QnA</option>
            </select>
        </div>

        <div class="row">
            <label for="visibility">공개 범위</label>
            <select id="visibility" name="visibility">
                <option value="PUBLIC">전체공개</option>
                <option value="PRIVATE">나만보기</option>
            </select>
        </div>

        <div class="row">
            <label for="content">설명</label>
            <textarea id="content" name="content" placeholder="동영상에 대한 설명을 입력하세요" required></textarea>
        </div>

        <div class="actions">
            <button id="submitBtn" type="submit">등록</button>
            <a id="cancel" href="/board/list">취소</a>
        </div>
    </form>
</main>

<script>
    // --- 공용 스크립트 (이전과 동일) ---
    const accessTokenKey = 'accessToken', refreshTokenKey = 'refreshToken';
    const getAccessToken = () => localStorage.getItem(accessTokenKey);
    const logout = () => { localStorage.removeItem(accessTokenKey); localStorage.removeItem(refreshTokenKey); alert('세션이 만료되었습니다. 다시 로그인해 주세요.'); location.href = '/login'; };
    let isRefreshing = false, refreshSubscribers = [];
    const onRefreshed = (t) => { refreshSubscribers.forEach(c => c(t)); refreshSubscribers = []; };
    const addRefreshSubscriber = (c) => { refreshSubscribers.push(c); };
    async function refreshAccessToken() { isRefreshing = true; try { const rt = localStorage.getItem(refreshTokenKey); if (!rt) { logout(); return Promise.reject(new Error('No refresh token')); } const res = await fetch('/api/auth/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refreshToken: rt }) }); if (!res.ok) { logout(); return Promise.reject(new Error('Failed to refresh token')); } const { accessToken: newAccessToken } = await res.json(); localStorage.setItem(accessTokenKey, newAccessToken); isRefreshing = false; onRefreshed(newAccessToken); return newAccessToken; } catch (e) { isRefreshing = false; logout(); return Promise.reject(e); } }
    async function api(path, options = {}) { const makeRequest = async (token) => { const { method = 'GET', headers = {}, body } = options; const h = { ...headers }; if (body && !('Content-Type' in h)) h['Content-Type'] = 'application/json'; if (token) h['Authorization'] = 'Bearer ' + token; return fetch(path, { method, headers: h, body }); }; let res = await makeRequest(getAccessToken()); if (res.status === 401) { if (!isRefreshing) { try { const newAccessToken = await refreshAccessToken(); res = await makeRequest(newAccessToken); } catch (error) { throw new Error('Session expired.'); } } else { res = await new Promise((resolve) => { addRefreshSubscriber(async (newAccessToken) => { resolve(await makeRequest(newAccessToken)); }); }); } } if (!res.ok) { let msg = `${res.status} ${res.statusText}`; try { const ct = res.headers.get('content-type') || ''; if (ct.includes('application/json')) { const j = await res.json(); if (j && (j.message || j.error)) msg += `: ${j.message || j.error}`; } else { const t = await res.text(); if (t) msg += `: ${t}`; } } catch {} throw new Error(msg); } const ct = res.headers.get('content-type') || ''; return ct.includes('application/json') ? res.json() : null; }
    
    // === 페이지 초기화 로직 (헤더 토글 + 권한 체크) ===
    async function initializePage() {
        const auth = document.getElementById('authLinks');

        if (!getAccessToken()) {
            alert('로그인이 필요합니다.');
            location.href = '/login';
            return;
        }

        try {
            const me = await api('/api/auth/me');
            // 로그인된 사용자 UI 설정
            if (auth) {
                auth.innerHTML = `<a href="/profile" style="margin-right: 10px;">내 정보</a><a href="#" id="logoutBtn">로그아웃</a>`;
            }

            // === 관리자 권한에 따른 카테고리 옵션 처리 ===
            if (!me.roles || !me.roles.includes('ROLE_ADMIN')) {
                const noticeOption = document.querySelector('#category option[value="NOTICE"]');
                if (noticeOption) noticeOption.remove();
            }
        } catch (error) {
            console.error("Failed to initialize page:", error);
        }
        
        document.addEventListener('click', (e) => {
            if (e.target && e.target.id === 'logoutBtn') {
                e.preventDefault();
                logout();
            }
        });
    }
    // ===============================================

    // --- 이 페이지의 고유 스크립트 시작 ---
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');
    const f = document.getElementById('f');
    const submitBtn = document.getElementById('submitBtn');

    let selectedFile = null;

    function handleFile(file) {
        if (!file) return;
        if (file.type !== 'video/mp4') {
            alert('MP4 형식의 동영상 파일만 업로드할 수 있습니다.');
            return;
        }
        const maxSize = 500 * 1024 * 1024;
        if (file.size > maxSize) {
            alert(`파일 크기는 500MB를 초과할 수 없습니다. (현재 파일 크기: ${(file.size / 1024 / 1024).toFixed(2)}MB)`);
            return;
        }
        selectedFile = file;
        fileInfo.textContent = `선택된 파일: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)}MB)`;
    }

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('active'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('active'));
    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('active');
        handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));

    f.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const title = document.getElementById('title').value.trim();
        const content = document.getElementById('content').value.trim();

        if (!title || !content) {
            alert('제목과 설명을 입력하세요.');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = '업로드 준비 중...';
        progressContainer.style.display = 'block';

        const formData = new FormData();
        const boardData = {
            title: title,
            content: content,
            category: document.getElementById('category').value,
            visibility: document.getElementById('visibility').value,
            tags: document.getElementById('tags').value.trim()
        };
        formData.append('req', new Blob([JSON.stringify(boardData)], { type: "application/json" }));

        if (selectedFile) {
            formData.append('videoFile', selectedFile);
        }

        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/board', true);
        
        const accessToken = getAccessToken();
        if (accessToken) {
            xhr.setRequestHeader('Authorization', 'Bearer ' + accessToken);
        }

        xhr.upload.onprogress = (event) => {
            if (event.lengthComputable) {
                const percentComplete = Math.round((event.loaded / event.total) * 100);
                progressBar.style.width = percentComplete + '%';
                progressBar.textContent = percentComplete + '%';
                submitBtn.textContent = `업로드 중... ${percentComplete}%`;
            }
        };

        xhr.onload = () => {
            submitBtn.disabled = false;
            submitBtn.textContent = '등록';

            if (xhr.status >= 200 && xhr.status < 300) {
                try {
                    const response = JSON.parse(xhr.responseText);
                    alert('게시글이 성공적으로 등록되었습니다.');
                    const newId = response?.id;
                    location.href = newId != null ? `/board/view?id=${encodeURIComponent(newId)}` : '/board/list';
                } catch (err) {
                    console.error("응답 처리 오류:", err);
                    alert("게시글은 등록되었으나, 응답 처리 중 문제가 발생했습니다.");
                    location.href = '/board/list';
                }
            } else {
                if (xhr.status === 401) {
                    logout();
                } else {
                    alert(`업로드 실패: ${xhr.status} ${xhr.statusText}`);
                }
            }
        };

        xhr.onerror = () => {
            submitBtn.disabled = false;
            submitBtn.textContent = '등록';
            alert('네트워크 오류로 업로드에 실패했습니다.');
        };

        xhr.send(formData);
    });

    initializePage();
</script>
</body>
</html>
