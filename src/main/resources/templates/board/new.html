<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <title>새 글</title>
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; }
        nav { margin-bottom: 16px; }
        nav a { margin-right: 8px; }
        input, select, textarea { width:100%; padding:8px; border:1px solid #e5e7eb; border-radius:8px; }
        textarea { min-height: 240px; }
        .row { margin-bottom: 12px; }
    </style>
</head>
<body>
<!-- 공통 네비 -->
<nav class="nav">
    <a href="/">홈</a> |
    <a href="/board/list">게시판</a> |
    <a href="#" id="newLink">새 글</a> |
    <span id="authLinks"></span>
</nav>

<main>
    <h1>새 글</h1>
    <form id="f">
        <div class="row">
            <label for="title">제목</label>
            <input id="title" name="title" placeholder="제목" maxlength="120" required>
        </div>

        <div class="row">
            <label for="category">분류</label>
            <select id="category" name="category">
                <option value="">분류 없음</option>
                <option value="notice">공지</option>
                <option value="free">자유</option>
            </select>
        </div>

        <div class="row">
            <label for="content">내용</label>
            <textarea id="content" name="content" placeholder="내용" required></textarea>
        </div>
        <button type="submit">등록</button>
        <a id="cancel" href="/board/list" style="margin-left:12px">취소</a>
    </form>
</main>

<script>
    // ===== 공통 유틸 =====
    const tokenKey = 'accessToken';
    const getToken = () => localStorage.getItem(tokenKey);

    async function api(path, {method='GET', headers={}, body, raw=false} = {}) {
        const h = {'Content-Type': 'application/json', ...headers};
        const t = getToken();
        if (t) h['Authorization'] = 'Bearer ' + t;
        const res = await fetch(path, {method, headers: h, body});
        if (res.status === 401) {
            localStorage.removeItem(tokenKey);
            alert('로그인이 필요합니다.');
            location.href = '/login';
            throw new Error('Unauthorized');
        }
        if (!res.ok) {
            const msg = await res.text().catch(()=> '');
            throw new Error(msg || ('HTTP '+res.status));
        }
        return raw ? res : res.json();
    }

    const escapeHtml = (s) => (s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const fmt = (iso) => iso ? new Date(iso).toLocaleString() : '';

    (function headerToggle(){
        const t = getToken();
        const auth = document.getElementById('authLinks');
        const newLink = document.getElementById('newLink');
        if (t) {
            if (auth) auth.innerHTML = `<a href="/profile">내 정보</a> | <a href="#" id="logoutBtn">로그아웃</a>`;
            if (newLink) newLink.href = '/board/new';
        } else {
            if (auth) auth.innerHTML = `<a href="/login">로그인</a>`;
            if (newLink) newLink.href = '/login';
        }
        // 새 글 페이지에선 "새 글" 버튼 숨김 (중복 진입 방지)
        if (newLink) newLink.style.display = 'none';

        document.addEventListener('click', (e) => {
            if (e.target && e.target.id === 'logoutBtn') {
                e.preventDefault();
                localStorage.removeItem(tokenKey);
                location.reload();
            }
        });
    })();

    // 로그인 필요
    if (!getToken()) {
        alert('로그인이 필요합니다.');
        location.href = '/login';
    }

    // ===== 작성/저장 로직 + 미저장 이탈 방지 =====
    const $ = (s)=>document.querySelector(s);
    const f = $('#f');

    window.__dirty = false;
    f.addEventListener('input', ()=> { window.__dirty = true; });

    window.addEventListener('beforeunload', (evt) => {
        if (window.__dirty) { evt.preventDefault(); evt.returnValue = ''; }
    });
    document.addEventListener('click', (e)=>{
        if (!window.__dirty) return;
        const a = e.target.closest('a');
        if (!a) return;
        if (a.target || a.href.startsWith('javascript:')) return;
        if (!confirm('변경 사항이 저장되지 않았습니다. 이동하시겠어요?')) e.preventDefault();
    });

    f.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const fd = new FormData(f);
        const payload = {
            title: (fd.get('title')||'').trim(),
            content: (fd.get('content')||'').trim(),
            category: fd.get('category') || null
        };
        const res = await api('/api/board', {method:'POST', body: JSON.stringify(payload)});
        window.__dirty = false;
        alert('등록되었습니다.');
        location.href = `/board/view?id=${encodeURIComponent(res.id)}`;
    });
</script>
</body>
</html>
