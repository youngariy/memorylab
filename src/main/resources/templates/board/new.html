<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8"><title>새 글</title>
    <style>
        body{font-family:sans-serif;max-width:760px;margin:24px auto;padding:0 12px}
        input,select,textarea,button{width:100%;padding:8px;box-sizing:border-box}
        .row{margin:10px 0}
    </style>
</head>
<body>
<a href="/board/list">← 목록</a>
<h1>새 글 작성</h1>
<form id="f">
    <div class="row">
        <label>카테고리
            <select id="category" required>
                <option value="">선택</option>
                <option>여행</option><option>가족</option><option>친구</option><option>기타</option>
            </select>
        </label>
    </div>
    <div class="row">
        <label>제목
            <input id="title" maxlength="120" required>
        </label>
    </div>
    <div class="row">
        <label>내용
            <textarea id="content" rows="12" required></textarea>
        </label>
    </div>
    <div class="row">
        <button>등록</button>
    </div>
</form>
<script>
    const token = localStorage.getItem('accessToken');
    document.getElementById('f').addEventListener('submit', async (e)=>{
        e.preventDefault();
        if (!token) return location.href='/login';
        const body = {
            title:   document.getElementById('title').value,
            content: document.getElementById('content').value,
            category:document.getElementById('category').value
        };
        const r = await fetch('/api/board', {
            method:'POST',
            headers:{'Content-Type':'application/json', Authorization:`Bearer ${token}`},
            body: JSON.stringify(body)
        });
        if (r.ok){
            const {id} = await r.json();
            location.href = `/board/view?id=${id}`;
        } else if (r.status===401) location.href='/login';
        else alert('등록 실패');
    });
</script>
</body>
</html>
