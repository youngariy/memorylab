<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <title>게시글 보기</title>
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; }
        nav { margin-bottom: 16px; }
        nav a { margin-right: 8px; }
        .title { font-size: 22px; font-weight: 700; margin: 8px 0; }
        .meta { color:#6b7280; margin-bottom:12px; }
        .content { white-space: pre-wrap; border:1px solid #e5e7eb; border-radius:12px; padding:16px; }
        #actions a { margin-right: 12px; }
        .pill { padding: 2px 8px; border:1px solid #ddd; border-radius: 999px; font-size: 12px; margin-left:6px; }
        .pill.private { border-color:#ef4444; color:#ef4444; }
    </style>
</head>
<body>
<nav class="nav">
    <a href="/">홈</a> |
    <a href="/board/list">게시판</a> |
    <a href="#" id="newLink">새 글</a> |
    <span id="authLinks"></span>
</nav>

<main>
    <div class="title" id="title"></div>
    <div class="meta">
        <b id="author"></b><span id="meta"></span>
    </div>
    <div id="content" class="content"></div>
    <div id="actions" style="margin-top:12px;"></div>
    <p style="margin-top:12px;"><a href="/board/list">목록</a></p>
</main>

<script>
    const tokenKey = 'accessToken';
    const getToken = () => localStorage.getItem(tokenKey);

    async function api(path, {method='GET', headers={}, body, raw=false} = {}) {
        const h = {'Content-Type': 'application/json', ...headers};
        const t = getToken(); if (t) h['Authorization'] = 'Bearer ' + t;
        const res = await fetch(path, {method, headers: h, body});
        if (res.status === 401) { localStorage.removeItem(tokenKey); alert('로그인이 만료되었어요. 다시 로그인해 주세요.'); location.href = '/login'; throw new Error('Unauthorized'); }
        if (!res.ok) { const msg = await res.text().catch(()=> ''); throw new Error(msg || ('HTTP '+res.status)); }
        return raw ? res : res.json();
    }

    const fmt = (iso) => iso ? new Date(iso).toLocaleString() : '';

    (function headerToggle(){
        const t = getToken();
        const auth = document.getElementById('authLinks');
        const newLink = document.getElementById('newLink');
        if (t) { if (auth) auth.innerHTML = `<a href="/profile">내 정보</a> | <a href="#" id="logoutBtn">로그아웃</a>`; if (newLink) newLink.href = '/board/new'; }
        else { if (auth) auth.innerHTML = `<a href="/login">로그인</a>`; if (newLink) newLink.href = '/login'; }
        document.addEventListener('click', (e) => {
            if (e.target && e.target.id === 'logoutBtn') { e.preventDefault(); localStorage.removeItem(tokenKey); location.reload(); }
        });
    })();

    const $ = (s)=>document.querySelector(s);
    const id = new URLSearchParams(location.search).get('id');

    async function loadDetail(){
        const data = await api(`/api/board/${id}`);
        document.getElementById('title').textContent = data.title || '';
        document.getElementById('author').textContent = (data.authorNickname ?? data.author?.nickname ?? '') || '';
        const category = data.category ?? '';
        const vis = String(data.visibility || 'PUBLIC').toUpperCase();
        const visTxt = vis === 'PRIVATE' ? '나만보기' : '전체공개';
        document.getElementById('meta').innerHTML =
            ` | 분류: ${category} | 공개: <span class="pill ${vis==='PRIVATE'?'private':''}">${visTxt}</span> | 조회수: ${data.viewCount ?? 0} | 작성: ${fmt(data.createdAt)}`;
        document.getElementById('content').textContent = data.content || '';

        let meId = null;
        try { const me = await api('/api/auth/me'); meId = me?.id ?? null; } catch {}

        const isOwner = meId && data.authorId && String(meId) === String(data.authorId);
        const actions = document.getElementById('actions');
        actions.innerHTML = '';
        if (getToken() && isOwner) {
            const edit = document.createElement('a');
            edit.href = `/board/edit?id=${encodeURIComponent(id)}`;
            edit.textContent = '수정';

            const del = document.createElement('a');
            del.href = '#';
            del.textContent = '삭제';
            del.addEventListener('click', async (e)=>{
                e.preventDefault();
                if (!confirm('삭제하시겠어요?')) return;
                await api(`/api/board/${id}`, {method:'DELETE'});
                alert('삭제되었습니다.');
                location.href = '/board/list';
            });

            actions.append(edit, del);
        }
    }

    loadDetail();
</script>
</body>
</html>
