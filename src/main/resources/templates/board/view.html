<!-- templates/board/view.html -->
<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>게시글 보기</title>
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; background-color: #f8f9fa; }
        main { padding: 10px 24px 24px; max-width: 900px; margin: 0 auto; background-color: #fff; border: 1px solid #dee2e6; border-radius: 8px; }
        .title { font-size: 28px; font-weight: 700; margin: 16px 0; }
        .content { white-space: pre-wrap; border-top:1px solid #e5e7eb; padding-top: 24px; margin-top: 24px; line-height: 1.7; font-size: 16px; }
        #actions a { margin-right: 12px; color: #495057; text-decoration: none; }
        #actions a:hover { text-decoration: underline; }

        .meta-container { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e7eb; padding-bottom: 16px; }
        .meta { color:#6b7280; font-size: 14px; }
        .like-button { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 8px 12px; border-radius: 8px; border: 1px solid #ced4da; background-color: #fff; transition: all 0.2s; }
        .like-button:hover { background-color: #f1f3f5; }
        .like-button .like-icon { color: #adb5bd; transition: color 0.2s; }
        .like-button.liked { border-color: #fa5252; background-color: #fff5f5; }
        .like-button.liked .like-icon { color: #fa5252; }

        #video-container, #model-container { margin-top: 24px; background-color: #f0f0f0; border-radius: 12px; overflow: hidden; min-height: 300px; display: flex; align-items: center; justify-content: center; position: relative; /* status-box 포지셔닝을 위해 추가 */}
        #video-container video, #video-container img { display: block; width: 100%; max-height: 500px; background-color: #000; }
        .status-box { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; background-color: rgba(0,0,0,0.5); color: white; font-size: 18px; text-align: center; }
        #ply-canvas-container { width: 100%; height: 500px; display: none; }

        #comment-section { margin-top: 40px; border-top: 1px solid #dee2e6; padding-top: 24px; }
        
        /* Comment Section */
        #comment-section h2 { font-size: 22px; margin-bottom: 16px; }
        #comment-form { display: flex; gap: 10px; margin-bottom: 24px; }
        #comment-form textarea { flex-grow: 1; border: 1px solid #ced4da; border-radius: 6px; padding: 10px; font-size: 15px; min-height: 60px; }
        #comment-form button { background-color: #343a40; color: #fff; border: none; border-radius: 6px; padding: 0 20px; font-size: 15px; cursor: pointer; }
        #comment-form button:hover { background-color: #495057; }

        #comment-list .comment { border-bottom: 1px solid #e9ecef; padding: 16px 0; }
        #comment-list .comment:last-child { border-bottom: none; }
        #comment-list .comment-meta { font-size: 14px; color: #495057; margin-bottom: 8px; }
        #comment-list .comment-meta b { font-weight: 600; }
        #comment-list .comment-content { font-size: 15px; line-height: 1.6; color: #212529; white-space: pre-wrap; }
        #comment-list .comment-actions { margin-top: 10px; font-size: 13px; }
        #comment-list .comment-actions button { background: none; border: none; color: #868e96; cursor: pointer; padding: 0; margin-right: 10px; }
        #comment-list .comment-actions button:hover { text-decoration: underline; }
    </style>
    <script src="https://unpkg.com/three@0.159.0/build/three.min.js"></script>
    <script src="https://unpkg.com/@spark-js/web@0.1.0/dist/spark.min.js"></script>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1 class="title" id="title"></h1>
    <div class="meta-container">
        <div class="meta">
            <b id="author"></b><span id="meta-info"></span>
        </div>
        <button id="likeBtn" class="like-button" style="display: none;">
            <span class="like-icon">♥</span>
            <span id="likeCount" class="like-count">0</span>
        </button>
    </div>
    
    <div id="video-container"></div>
    <div id="model-container"></div>

    <div id="content" class="content"></div>
    <div id="actions" style="margin-top:24px;"></div>
    <p style="margin-top:12px;"><a href="/board/list">목록으로</a></p>

    <section id="comment-section">
        <h2>댓글</h2>
        <div id="comment-form-container"></div>
        <div id="comment-list"></div>
    </section>
</main>

<script>
    // --- 공용 유틸 및 인증 로직 (완전 복원) ---
    const accessTokenKey = 'accessToken', refreshTokenKey = 'refreshToken';
    const getAccessToken = () => localStorage.getItem(accessTokenKey);
    
    // 공용 API 헬퍼 (동일 출처 기준)
    async function api(path, options = {}) {
        const headers = new Headers(options.headers || {});
        // JSON 기본값
        if (!headers.has('Accept')) headers.set('Accept', 'application/json');
        if (options.body && !headers.has('Content-Type')) headers.set('Content-Type', 'application/json');

        // 토큰 있으면 Authorization 추가
        const token = getAccessToken();
        if (token && !headers.has('Authorization')) headers.set('Authorization', `Bearer ${token}`);

        const res = await fetch(path, { credentials: 'same-origin', ...options, headers });

        // 401 → 로그인 페이지로
        if (res.status === 401) {
            // 필요시 리프레시 토큰 로직 여기에 추가
            location.href = `/login?redirect=${encodeURIComponent(location.pathname + location.search)}`;
            throw new Error('Unauthorized');
        }

        // 본문 타입에 따라 파싱
        const ct = res.headers.get('Content-Type') || '';
        const isJson = ct.includes('application/json');

        if (!res.ok) {
            let detail;
            try { detail = isJson ? await res.json() : await res.text(); } catch { detail = ''; }
            throw new Error(`HTTP ${res.status} ${res.statusText} ${detail ? '- ' + (typeof detail === 'string' ? detail : JSON.stringify(detail)) : ''}`);
        }
        
        // 204 No Content와 같이 본문이 없는 성공 응답 처리
        if (res.status === 204) return;

        return isJson ? res.json() : res.text();
    }

    // --- 페이지 전용 스크립트 (완전 복원 및 통합) ---
    const $ = (s)=>document.querySelector(s);
    const boardId = new URLSearchParams(location.search).get('id');

    const statusLabel = {
      DISPATCHED:   "변환 대기",
      PROCESSING:   "3D 모델 변환 중",
      RESULT_READY: "결과 준비 중",
      DOWNLOADING:  "썸네일 준비 중",
      READY:        "완료",
      FAILED_POLL:     "상태 확인 실패",
      FAILED_PROCESS:  "3D 모델 변환 실패",
      FAILED_DOWNLOAD: "결과 다운로드 실패",
      CANCELLED:       "취소됨",
    };

    async function loadDetail(){
        try {
            const me = getAccessToken() ? await api('/api/auth/me') : null;
            const data = await api(`/api/board/${boardId}`);

            // --- 기본 정보 및 동적 UI 완전 복원 ---
            $('#title').textContent = data.title;
            $('#author').textContent = data.authorNickname;
            $('#meta-info').innerHTML = ` | ${data.category} | ${new Date(data.createdAt).toLocaleString()}`;
            $('#content').textContent = data.content;
            $('#likeBtn').style.display = 'flex';
            $('#likeCount').textContent = data.likeCount;
            $('#likeBtn').classList.toggle('liked', data.isLikedByCurrentUser);
            
            // 수정/삭제 버튼 복원
            if (me && (me.id === data.authorId || me.roles.includes('ROLE_ADMIN'))) {
                $('#actions').innerHTML = `<a href="/board/edit?id=${boardId}">수정</a><a href="#" id="deleteBtn">삭제</a>`;
                $('#deleteBtn').addEventListener('click', async (e) => { 
                    e.preventDefault();
                    if (!confirm('정말로 이 게시글을 삭제하시겠습니까?')) return;
                    await api(`/api/board/${boardId}`, { method: 'DELETE' });
                    alert('삭제되었습니다.');
                    location.href = '/board/list';
                });
            }

            // --- 댓글 기능 로드 ---
            loadComments(me);

            // --- 1. 동영상 및 썸네일 렌더링 (view.html 용으로 재수정) ---
            const videoContainer = $('#video-container');
            const toAbs = u => u?.startsWith('http') ? u : (u?.startsWith('/') ? u : `/${u}`);

            if (data.transcodeStatus === 'READY' && data.convertedVideoPath) {
                // 비디오 준비 완료: 비디오 플레이어 표시 (썸네일은 포스터로)
                const posterThumb = (data.thumbnailStatus === 'READY' && data.thumbnailPath)
                    ? toAbs(data.thumbnailPath)
                    : '/img/default_thumbnail.jpg';
                videoContainer.innerHTML = 
                    `<video controls preload="metadata" src="${toAbs(data.convertedVideoPath)}" poster="${posterThumb}"></video>`;
            } else if (data.transcodeStatus === 'PENDING' || data.transcodeStatus === 'CONVERTING') {
                // 비디오 처리 중: 상태 메시지만 표시 (썸네일 없음)
                videoContainer.innerHTML = `<div class="status-box" style="position: static; background: transparent; color: #6b7280;">⏳ 동영상을 웹 형식으로 변환하고 있습니다...</div>`;
            } else {
                // 실패 또는 기타 상태: 실패 메시지와 기본 이미지 표시
                videoContainer.style.position = 'relative';
                videoContainer.innerHTML = `<img src="/img/default_thumbnail.jpg" alt="Error" style="filter: brightness(0.5);"><div class="status-box">❌ 동영상 준비에 실패했습니다.</div>`;
            }

            // --- 2. 3D 모델 상태 및 뷰어 렌더링 (독립적 실행) ---
            const modelContainer = $('#model-container');
            if (data.status === 'READY' && data.plyPath) {
                modelContainer.innerHTML = `<div class="status-box"><button id="show-ply-btn">3D 보기</button></div><div id="ply-canvas-container"></div>`;
                $('#show-ply-btn').addEventListener('click', () => { /* 3D 뷰어 실행 로직 */ });
            } else if (data.taskId) {
                const statusText = statusLabel[data.status] || "상태 확인 중";
                const icon = data.status && data.status.startsWith('FAILED') ? '❌' : '⏳';
                modelContainer.innerHTML = `<div class="status-box">${icon} 3D 모델: ${statusText}</div>`;
            } else {
                modelContainer.style.display = 'none';
            }

        } catch (err) {
            console.error('Error loading board detail:', err);
            alert('게시글을 불러오는 데 실패했습니다.');
        }
    }

    // --- 댓글 기능 스크립트 ---
    async function loadComments(me) {
        // 1. 댓글 작성 폼 렌더링
        const commentFormContainer = $('#comment-form-container');
        if (me) {
            commentFormContainer.innerHTML = `
                <form id="comment-form">
                    <textarea id="comment-content" placeholder="댓글을 입력하세요..." required></textarea>
                    <button type="submit">등록</button>
                </form>
            `;
            // 폼 제출 이벤트
            $('#comment-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const content = $('#comment-content').value;
                if (!content.trim()) return;

                try {
                    await api(`/api/board/${boardId}/comments`, {
                        method: 'POST',
                        body: JSON.stringify({ content })
                    });
                    $('#comment-content').value = '';
                    loadComments(me); // 목록 새로고침
                } catch (err) {
                    console.error('Failed to create comment:', err);
                    alert('댓글 작성에 실패했습니다.');
                }
            });
        } else {
            commentFormContainer.innerHTML = '<p><a href="/login">로그인</a> 후 댓글을 작성할 수 있습니다.</p>';
        }

        // 2. 댓글 목록 로드 및 렌더링
        try {
            const commentsPage = await api(`/api/board/${boardId}/comments?sort=createdAt,asc`);
            const commentList = $('#comment-list');
            commentList.innerHTML = commentsPage.content.map(c => renderComment(c, me)).join('');
        } catch (err) {
            console.error('Failed to load comments:', err);
            $('#comment-list').innerHTML = '<p>댓글을 불러오는 데 실패했습니다.</p>';
        }
    }

    function renderComment(comment, me) {
        const isAuthor = me && me.id === comment.authorId;
        const actions = isAuthor ? `
            <div class="comment-actions" data-comment-id="${comment.id}">
                <button class="edit-btn">수정</button>
                <button class="delete-btn">삭제</button>
            </div>
        ` : '';

        return `
            <div class="comment" data-comment-id="${comment.id}">
                <div class="comment-meta">
                    <b>${comment.authorNickname}</b> | ${new Date(comment.createdAt).toLocaleString()}
                </div>
                <div class="comment-content">${comment.content}</div>
                ${actions}
            </div>
        `;
    }
    
    // 댓글 수정 및 삭제 (이벤트 위임)
    $('#comment-list').addEventListener('click', async (e) => {
        const commentDiv = e.target.closest('.comment');
        if (!commentDiv) return;
        
        const commentId = commentDiv.dataset.commentId;

        // 삭제 버튼
        if (e.target.classList.contains('delete-btn')) {
            if (!confirm('정말로 이 댓글을 삭제하시겠습니까?')) return;
            try {
                await api(`/api/comments/${commentId}`, { method: 'DELETE' });
                commentDiv.remove();
            } catch (err) {
                console.error('Failed to delete comment:', err);
                alert('댓글 삭제에 실패했습니다.');
            }
        }

        // 수정 버튼
        if (e.target.classList.contains('edit-btn')) {
            const contentDiv = commentDiv.querySelector('.comment-content');
            const originalContent = contentDiv.textContent;
            
            contentDiv.innerHTML = `
                <textarea style="width: 100%; min-height: 60px;">${originalContent}</textarea>
                <button class="save-btn">저장</button>
                <button class="cancel-btn">취소</button>
            `;

            const saveBtn = contentDiv.querySelector('.save-btn');
            const cancelBtn = contentDiv.querySelector('.cancel-btn');
            const textarea = contentDiv.querySelector('textarea');

            saveBtn.onclick = async () => {
                const newContent = textarea.value;
                if (!newContent.trim()) return;
                try {
                    const updatedComment = await api(`/api/comments/${commentId}`, {
                        method: 'PUT',
                        body: JSON.stringify({ content: newContent })
                    });
                    const me = getAccessToken() ? await api('/api/auth/me') : null;
                    commentDiv.outerHTML = renderComment(updatedComment, me);
                } catch (err) {
                    console.error('Failed to update comment:', err);
                    alert('댓글 수정에 실패했습니다.');
                }
            };

            cancelBtn.onclick = () => {
                contentDiv.textContent = originalContent;
            };
        }
    });

    document.addEventListener('DOMContentLoaded', loadDetail);

    // --- 좋아요 버튼 이벤트 핸들러 ---
    $('#likeBtn').addEventListener('click', async () => {
        try {
            // API 호출
            const result = await api(`/api/board/${boardId}/like`, { method: 'POST' });
            
            // UI 업데이트
            $('#likeCount').textContent = result.likeCount;
            $('#likeBtn').classList.toggle('liked', result.isLiked);

        } catch (err) {
            console.error('Failed to toggle like:', err);
            // 401 에러는 api() 헬퍼가 자동으로 처리하므로, 그 외의 에러에 대한 알림
            if (!err.message.includes('Unauthorized')) {
                alert('좋아요 처리에 실패했습니다. 잠시 후 다시 시도해주세요.');
            }
        }
    });
</script>

</body>
</html>
