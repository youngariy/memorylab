<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <title>게시글 보기</title>
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; }
        nav { margin-bottom: 16px; }
        nav a { margin-right: 8px; }
        .title { font-size: 22px; font-weight: 700; margin: 8px 0; }
        .meta { color:#6b7280; margin-bottom:12px; }
        .content { white-space: pre-wrap; border:1px solid #e5e7eb; border-radius:12px; padding:16px; }
        #actions a { margin-right: 12px; }
    </style>
</head>
<body>
<!-- 공통 네비 -->
<nav class="nav">
    <a href="/">홈</a> |
    <a href="/board/list">게시판</a> |
    <a href="#" id="newLink">새 글</a> |
    <span id="authLinks"></span>
</nav>

<main>
    <div class="title" id="title"></div>
    <div class="meta">
        <b id="author"></b><span id="meta"></span>
    </div>
    <div id="content" class="content"></div>
    <div id="actions" style="margin-top:12px;"></div>
    <p style="margin-top:12px;"><a href="/board/list">목록</a></p>
</main>

<script>
    // ===== 공통 유틸 =====
    const tokenKey = 'accessToken';
    const getToken = () => localStorage.getItem(tokenKey);

    async function api(path, {method='GET', headers={}, body, raw=false} = {}) {
        const h = {'Content-Type': 'application/json', ...headers};
        const t = getToken();
        if (t) h['Authorization'] = 'Bearer ' + t;
        const res = await fetch(path, {method, headers: h, body});
        if (res.status === 401) {
            localStorage.removeItem(tokenKey);
            alert('로그인이 만료되었어요. 다시 로그인해 주세요.');
            location.href = '/login';
            throw new Error('Unauthorized');
        }
        if (!res.ok) {
            const msg = await res.text().catch(()=> '');
            throw new Error(msg || ('HTTP '+res.status));
        }
        return raw ? res : res.json();
    }

    const escapeHtml = (s) => (s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const fmt = (iso) => iso ? new Date(iso).toLocaleString() : '';

    (function headerToggle(){
        const t = getToken();
        const auth = document.getElementById('authLinks');
        const newLink = document.getElementById('newLink');
        if (t) {
            if (auth) auth.innerHTML = `<a href="/profile">내 정보</a> | <a href="#" id="logoutBtn">로그아웃</a>`;
            if (newLink) newLink.href = '/board/new';
        } else {
            if (auth) auth.innerHTML = `<a href="/login">로그인</a>`;
            if (newLink) newLink.href = '/login';
        }
        document.addEventListener('click', (e) => {
            if (e.target && e.target.id === 'logoutBtn') {
                e.preventDefault();
                localStorage.removeItem(tokenKey);
                location.reload();
            }
        });
    })();

    // ===== 상세 로직 =====
    const $ = (s)=>document.querySelector(s);
    const id = new URLSearchParams(location.search).get('id');

    async function loadDetail(){
        const data = await api(`/api/board/${id}`);
        $('#title').textContent = data.title || '';
        $('#author').textContent = (data.authorNickname ?? data.author?.nickname ?? '') || '';
        $('#meta').textContent = ` | 분류: ${data.category ?? ''} | 조회수: ${data.viewCount ?? 0} | 작성: ${fmt(data.createdAt)}`;
        $('#content').textContent = data.content || '';

        // 작성자 본인일 때만 수정/삭제 노출 (me API가 없어도 동작은 함: 버튼 미노출)
        let meId = null;
        try {
            const me = await api('/api/auth/me');
            meId = me?.id ?? null;
        } catch { /* ignore */ }

        const isOwner = meId && data.authorId && String(meId) === String(data.authorId);
        const actions = $('#actions');
        actions.innerHTML = '';
        if (getToken()) {
            const edit = document.createElement('a');
            edit.href = `/board/edit?id=${encodeURIComponent(id)}`;
            edit.textContent = '수정';

            const del = document.createElement('a');
            del.href = '#';
            del.textContent = '삭제';
            del.addEventListener('click', async (e)=>{
                e.preventDefault();
                if (!confirm('삭제하시겠어요?')) return;
                await api(`/api/board/${id}`, {method:'DELETE'});
                alert('삭제되었습니다.');
                location.href = '/board/list';
            });

            actions.append(edit, del);
        }
    }

    loadDetail();
</script>
</body>
</html>
