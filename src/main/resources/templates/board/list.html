<!-- templates/board/list.html -->
<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <title>게시판 목록 - MemoryLab</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; line-height: 1.5; }
        header, nav { margin-bottom: 12px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f7f7f7; }
        .toolbar { display:flex; gap:8px; align-items:center; margin: 12px 0; flex-wrap: wrap; }
        .spacer { flex: 1 }
        .btn { display:inline-block; padding: 8px 12px; border:1px solid #ccc; border-radius:6px; text-decoration:none; cursor:pointer; }
        .btn-primary { background:#111; color:#fff; border-color:#111; }
        .btn[disabled] { opacity: .5; cursor: not-allowed; }
        .pill { padding: 2px 8px; border:1px solid #ddd; border-radius: 999px; font-size: 12px; }
        .pill.private { border-color:#ef4444; color:#ef4444; }
        .pager { display:flex; gap:6px; align-items:center; flex-wrap: wrap; margin-top: 12px; }
        .page { padding:4px 10px; border:1px solid #ccc; border-radius:6px; text-decoration:none; }
        .page.active { background:#111; color:#fff; border-color:#111; pointer-events:none; }
        .meta { color:#666; font-size:12px; }
    </style>
</head>
<body>

<header>
    <h1>게시판</h1>
    <nav>
        <a href="/">홈</a> |
        <a href="/board/list">게시판</a> |
        <span id="authLinks">
      <a href="/login">로그인</a> | <a href="/signup">회원가입</a>
    </span>
    </nav>
    <p id="loginState" class="meta">로그인 상태 확인 중...</p>
</header>

<section class="toolbar">
    <form id="searchForm" class="toolbar" style="margin:0;">
        <input type="text" id="q" name="q" placeholder="제목 검색" />
        <select id="category" name="category">
            <option value="">전체 카테고리</option>
            <option value="NOTICE">공지</option>
            <option value="FREE">자유</option>
            <option value="QNA">QnA</option>
        </select>
        <button type="submit" class="btn">검색</button>
    </form>
    <span class="spacer"></span>
    <a id="newBtn" href="/board/new" class="btn btn-primary" style="display:none;">새 글</a>
</section>

<table>
    <thead>
    <tr>
        <th style="width:72px;">번호</th>
        <th>제목</th>
        <th style="width:120px;">카테고리</th>
        <th style="width:140px;">작성자</th>
        <th style="width:90px;">조회</th>
        <th style="width:180px;">작성일</th>
    </tr>
    </thead>
    <tbody id="listBody">
    <tr><td colspan="6" class="meta">불러오는 중...</td></tr>
    </tbody>
</table>

<div class="pager" id="pager"></div>

<script>
    const TOKEN_KEY = 'accessToken';
    const token = localStorage.getItem(TOKEN_KEY);

    const loginState = document.getElementById('loginState');
    const authLinks  = document.getElementById('authLinks');
    const newBtn     = document.getElementById('newBtn');

    if (token) {
        loginState.textContent = '로그인 상태: 토큰 보유';
        authLinks.innerHTML = `<a href="/profile">내 정보</a> | <a href="#" id="logoutBtn">로그아웃</a>`;
        newBtn.style.display = 'inline-block';
    } else {
        loginState.textContent = '로그인 상태: 미로그인';
        newBtn.style.display = 'none';
    }

    document.addEventListener('click', (e) => {
        if (e.target && e.target.id === 'logoutBtn') {
            e.preventDefault();
            localStorage.removeItem(TOKEN_KEY);
            location.reload();
        }
    });

    function escapeHtml(str) {
        if (str == null) return '';
        return String(str)
            .replaceAll('&','&amp;')
            .replaceAll('<','&lt;')
            .replaceAll('>','&gt;')
            .replaceAll('"','&quot;')
            .replaceAll("'",'&#39;');
    }

    function fmtDate(iso) { try { return new Date(iso).toLocaleString('ko-KR'); } catch { return iso || ''; } }

    function getQs() {
        const p = new URLSearchParams(location.search);
        return {
            q: p.get('q') || '',
            category: p.get('category') || '',
            page: Math.max(0, parseInt(p.get('page') || '0', 10)) || 0,
            size: Math.max(1, parseInt(p.get('size') || '10', 10)) || 10
        };
    }

    function setFormFromQs() {
        const qs = getQs();
        document.getElementById('q').value = qs.q;
        document.getElementById('category').value = qs.category;
    }

    async function loadList() {
        const { q, category, page, size } = getQs();
        const url = new URL('/api/board', location.origin);
        if (q)        url.searchParams.set('q', q);
        if (category) url.searchParams.set('category', category); // Enum 값 그대로 전달
        url.searchParams.set('page', page);
        url.searchParams.set('size', size);

        const tbody = document.getElementById('listBody');
        const pager = document.getElementById('pager');

        tbody.innerHTML = `<tr><td colspan="6" class="meta">불러오는 중...</td></tr>`;
        pager.innerHTML = '';

        try {
            const res = await fetch(url, { headers: token ? { 'Authorization': 'Bearer ' + token } : {} });
            if (!res.ok) throw new Error('목록 조회 실패(' + res.status + ')');
            const data = await res.json();

            const items = Array.isArray(data.content) ? data.content : [];

            // 🔢 번호 계산 준비
            const total    = parseInt(data.totalElements ?? 0, 10) || 0;
            const curPage  = parseInt(data.number ?? page, 10) || 0;
            const pageSize = parseInt(data.size ?? size, 10)   || size;
            // 현재 페이지의 첫 번째 행 번호(전역 기준, 정렬: 최신글 우선 가정)
            const pageStartNo = total ? (total - (curPage * pageSize)) : (curPage * pageSize + 1);

            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="meta">게시글이 없습니다.</td></tr>`;
            } else {
                tbody.innerHTML = items.map((it, idx) => {
                    // 전역 기준 번호 (total이 없으면 페이지 내부 번호로 대체)
                    const rowNo = total ? (pageStartNo - idx) : (curPage * pageSize + idx + 1);

                    const id        = it.id;
                    const title     = escapeHtml(it.title);
                    const categoryV = escapeHtml(it.category || '');
                    const vis       = String(it.visibility || '').toUpperCase();
                    const author    = escapeHtml(it.authorNickname || '익명');
                    const views     = (typeof it.viewCount === 'number') ? it.viewCount : (it.viewCount || 0);
                    const createdAt = fmtDate(it.createdAt);

                    return `
            <tr>
              <td>${rowNo}</td>
              <td>
                <a href="/board/view?id=${encodeURIComponent(id)}">${title}</a>
                ${categoryV ? ` <span class="pill">${categoryV}</span>` : ''}
                ${vis === 'PRIVATE' ? ` <span class="pill private">나만보기</span>` : ''}
              </td>
              <td>${categoryV || '-'}</td>
              <td>${author}</td>
              <td>${views}</td>
              <td>${createdAt}</td>
            </tr>
          `;
                }).join('');
            }

            const totalPages = Math.max(1, parseInt(data.totalPages ?? 1, 10) || 1);
            const cur = Math.min(Math.max(0, parseInt(data.number ?? page, 10) || 0), totalPages - 1);

            const linkTo = (p) => {
                const sp = new URLSearchParams(location.search);
                sp.set('page', p);
                sp.set('size', data.size ?? size);
                return `?${sp.toString()}`;
            };

            const prev = document.createElement('a');
            prev.className = 'page'; prev.textContent = '이전'; prev.href = linkTo(Math.max(0, cur - 1));
            if (cur === 0) prev.setAttribute('disabled', 'true');
            pager.appendChild(prev);

            const windowSize = 5;
            const start = Math.max(0, cur - Math.floor(windowSize/2));
            const end = Math.min(totalPages - 1, start + windowSize - 1);
            for (let p = start; p <= end; p++) {
                const a = document.createElement('a');
                a.className = 'page' + (p === cur ? ' active' : '');
                a.textContent = (p + 1);
                a.href = linkTo(p);
                pager.appendChild(a);
            }

            const next = document.createElement('a');
            next.className = 'page'; next.textContent = '다음'; next.href = linkTo(Math.min(totalPages - 1, cur + 1));
            if (cur >= totalPages - 1) next.setAttribute('disabled', 'true');
            pager.appendChild(next);

        } catch (e) {
            document.getElementById('listBody').innerHTML =
                `<tr><td colspan="6" class="meta">오류: ${escapeHtml(e.message || e)}</td></tr>`;
            console.error(e);
        }
    }

    document.getElementById('searchForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const q = document.getElementById('q').value.trim();
        const category = document.getElementById('category').value;
        const params = new URLSearchParams(location.search);
        if (q) params.set('q', q); else params.delete('q');
        if (category) params.set('category', category); else params.delete('category');
        params.set('page', '0');
        location.search = '?' + params.toString();
    });

    setFormFromQs();
    loadList();
    window.addEventListener('popstate', () => { setFormFromQs(); loadList(); });
</script>


</body>
</html>
