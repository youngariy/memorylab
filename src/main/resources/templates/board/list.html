<!-- templates/board/list.html -->
<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>게시판 - MemoryLab</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; line-height: 1.5; margin: 0; background-color: #f8f9fa; }
        main { padding: 10px 24px 24px 24px; }

        /* 검색 툴바 */
        .toolbar { display:flex; gap:8px; align-items:center; margin: 12px 0; flex-wrap: wrap; }
        .spacer { flex: 1 }
        .btn { display:inline-block; padding: 8px 12px; border:1px solid #ccc; border-radius:6px; text-decoration:none; cursor:pointer; background-color: #fff; }
        .btn-primary { background:#111; color:#fff; border-color:#111; }

        /* 카드 레이아웃 */
        #board-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card {
            background-color: #fff;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 4px 20px rgba(0,0,0,0.08); }

        /* 썸네일 */
        .card-thumbnail {
            width: 100%;
            padding-top: 56.25%; /* 16:9 비율 */
            background-size: cover;
            background-position: center;
            background-color: #f1f3f5;
        }

        /* 카드 컨텐츠 */
        .card-content { padding: 16px; flex-grow: 1; }
        .card-title { display: flex; align-items: center; font-size: 18px; font-weight: 600; margin: 0 0 8px 0; }
        .card-title-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .video-icon { margin-left: 6px; flex-shrink: 0; }
        .card-author { font-size: 14px; color: #495057; }

        /* 카드 푸터 (메타 정보 및 좋아요) */
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-top: 1px solid #f1f3f5;
            font-size: 14px;
            color: #868e96;
        }
        .card-meta-info { display: flex; gap: 12px; align-items: center; }
        .like-button, .comment-info {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background-color 0.2s;
        }
        .like-button:hover { background-color: #f1f3f5; }
        .like-button.liked .like-icon { color: #fa5252; }
        .like-icon { font-size: 18px; color: #adb5bd; }
        .comment-icon { font-size: 18px; color: #adb5bd; }

        /* 페이저 */
        .pager { display:flex; justify-content: center; gap:6px; align-items:center; flex-wrap: wrap; margin-top: 24px; }
        .page { padding:4px 10px; border:1px solid #ccc; border-radius:6px; text-decoration:none; background-color: #fff; }
        .page.active { background:#111; color:#fff; border-color:#111; pointer-events:none; }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1>게시판</h1>
    <section class="toolbar">
        <form id="searchForm" class="toolbar" style="margin:0;">
            <input type="text" id="q" name="q" placeholder="제목/내용 검색" />
            <select id="category" name="category">
                <option value="">전체 카테고리</option>
                <option value="NOTICE">공지</option>
                <option value="FREE">자유</option>
                <option value="QNA">QnA</option>
            </select>
            <button type="submit" class="btn">검색</button>
        </form>
        <span class="spacer"></span>
        <a id="newBtn" href="/board/new" class="btn btn-primary" style="display:none;">새 글</a>
    </section>

    <!-- 카드 목록이 표시될 컨테이너 -->
    <div id="board-list"></div>

    <div class="pager" id="pager"></div>
</main>

<script>
    // === 공용 스크립트 (생략) ===
    const accessTokenKey = 'accessToken';
    const getAccessToken = () => localStorage.getItem(accessTokenKey);
    async function api(path, options = {}) { /* ... */ }
    (function headerToggle(){ /* ... */ })();
    function escapeHtml(str) { if (str == null) return ''; return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;'); }
    function fmtDate(iso) { try { return new Date(iso).toLocaleString('ko-KR'); } catch { return iso || ''; } }
    function getQs() { const p = new URLSearchParams(location.search); return { q: p.get('q') || '', category: p.get('category') || '', page: Math.max(0, parseInt(p.get('page') || '0', 10)) || 0, size: Math.max(1, parseInt(p.get('size') || '12', 10)) || 12 }; }
    function setFormFromQs() { const qs = getQs(); document.getElementById('q').value = qs.q; document.getElementById('category').value = qs.category; }

    async function loadList() {
        const { q, category, page, size } = getQs();
        const url = new URL('/api/board', location.origin);
        if (q) url.searchParams.set('q', q);
        if (category) url.searchParams.set('category', category);
        url.searchParams.set('page', page);
        url.searchParams.set('size', size);

        const boardListContainer = document.getElementById('board-list');
        const pager = document.getElementById('pager');
        boardListContainer.innerHTML = '<p>불러오는 중...</p>';
        pager.innerHTML = '';

        try {
            const data = await api(url.toString());
            const items = data.content || [];

            if (items.length === 0) {
                boardListContainer.innerHTML = '<p>게시글이 없습니다.</p>';
            } else {
                boardListContainer.innerHTML = items.map(it => {
                    let thumbnailUrl = '/thumbnails/default.jpg';
                    if (it.thumbnailStatus === 'READY' && it.thumbnailUrl) {
                        thumbnailUrl = it.thumbnailUrl;
                    }

                    let videoIcon = '';
                    if (it.transcodeStatus === 'COMPLETED') {
                        videoIcon = '🎥';
                    } else if (it.transcodeStatus === 'PENDING' || it.transcodeStatus === 'PROCESSING') {
                        videoIcon = '⏳';
                    }

                    const isLiked = it.isLikedByCurrentUser;

                    return `
                        <a href="/board/view?id=${it.id}" class="card">
                            <div class="card-thumbnail" style="background-image: url('${escapeHtml(thumbnailUrl)}')"></div>
                            <div class="card-content">
                                <h3 class="card-title">
                                    <span class="card-title-text">${escapeHtml(it.title)}</span>
                                    <span class="video-icon">${videoIcon}</span>
                                </h3>
                                <p class="card-author">${escapeHtml(it.authorNickname)}</p>
                            </div>
                            <div class="card-footer">
                                <div class="card-meta-info">
                                    <span>조회 ${it.viewCount}</span>
                                    <div class="like-button ${isLiked ? 'liked' : ''}" data-board-id="${it.id}">
                                        <span class="like-icon">♥</span>
                                        <span class="like-count">${it.likeCount}</span>
                                    </div>
                                    <div class="comment-info">
                                        <span class="comment-icon">💬</span>
                                        <span class="comment-count">${it.commentCount}</span>
                                    </div>
                                </div>
                            </div>
                        </a>
                    `;
                }).join('');
            }

            // 페이저 렌더링 로직 (기존과 동일)
            const totalPages = Math.max(1, parseInt(data.totalPages ?? 1, 10) || 1);
            const cur = Math.min(Math.max(0, parseInt(data.number ?? page, 10) || 0), totalPages - 1);
            const linkTo = (p) => { const sp = new URLSearchParams(location.search); sp.set('page', p); sp.set('size', data.size ?? size); return `?${sp.toString()}`; };
            const prev = document.createElement('a'); prev.className = 'page'; prev.textContent = '이전'; prev.href = linkTo(Math.max(0, cur - 1)); if (cur === 0) prev.setAttribute('disabled', 'true'); pager.appendChild(prev);
            const windowSize = 5; const start = Math.max(0, cur - Math.floor(windowSize/2)); const end = Math.min(totalPages - 1, start + windowSize - 1);
            for (let p = start; p <= end; p++) { const a = document.createElement('a'); a.className = 'page' + (p === cur ? ' active' : ''); a.textContent = (p + 1); a.href = linkTo(p); pager.appendChild(a); }
            const next = document.createElement('a'); next.className = 'page'; next.textContent = '다음'; next.href = linkTo(Math.min(totalPages - 1, cur + 1)); if (cur >= totalPages - 1) next.setAttribute('disabled', 'true'); pager.appendChild(next);

        } catch (e) {
            boardListContainer.innerHTML = `<p>오류: ${escapeHtml(e.message || e)}</p>`;
            console.error(e);
        }
    }

    // '좋아요' 버튼 클릭 이벤트 위임
    document.getElementById('board-list').addEventListener('click', async (e) => {
        const likeButton = e.target.closest('.like-button');
        if (!likeButton) return;

        e.preventDefault(); // a 태그의 기본 동작(페이지 이동) 방지

        if (!getAccessToken()) {
            alert('로그인이 필요합니다.');
            location.href = '/login';
            return;
        }

        const boardId = likeButton.dataset.boardId;
        try {
            // [개선] API 호출 후 반환된 값으로 UI를 즉시 업데이트합니다.
            const response = await api(`/api/board/${boardId}/like`, { method: 'POST' });
            
            if (response && typeof response.isLiked === 'boolean' && typeof response.likeCount === 'number') {
                likeButton.classList.toggle('liked', response.isLiked);
                likeButton.querySelector('.like-count').textContent = response.likeCount;
            } else {
                // 만약의 경우를 대비해, 응답이 예상과 다르면 페이지를 새로고침하여 최신 상태를 반영합니다.
                console.warn('Like API response is not as expected, reloading page.', response);
                location.reload();
            }

        } catch (err) {
            alert('좋아요 처리 중 오류가 발생했습니다.');
            console.error(err);
        }
    });

    // 페이지 로드 및 검색 폼 이벤트 리스너
    document.getElementById('searchForm').addEventListener('submit', (e) => { e.preventDefault(); const q = document.getElementById('q').value; const category = document.getElementById('category').value; const sp = new URLSearchParams(); if (q) sp.set('q', q); if (category) sp.set('category', category); history.pushState({}, '', `?${sp.toString()}`); loadList(); });
    setFormFromQs();
    loadList();
    window.addEventListener('popstate', () => { setFormFromQs(); loadList(); });

    // 공용 스크립트 재정의 (간소화)
    async function api(path, options = {}) { const makeRequest = async (token) => { const { method = 'GET', headers = {}, body } = options; const h = { ...headers }; if (body && !('Content-Type' in h)) h['Content-Type'] = 'application/json'; if (token) h['Authorization'] = 'Bearer ' + token; return fetch(path, { method, headers: h, body }); }; let res = await makeRequest(getAccessToken()); if (res.status === 401) { try { const newAccessToken = await refreshAccessToken(); res = await makeRequest(newAccessToken); } catch (error) { throw new Error('Session expired.'); } } if (!res.ok) { let msg = `${res.status} ${res.statusText}`; try { const ct = res.headers.get('content-type') || ''; if (ct.includes('application/json')) { const j = await res.json(); if (j && (j.message || j.error)) msg += `: ${j.message || j.error}`; } else { const t = await res.text(); if (t) msg += `: ${t}`; } } catch {} throw new Error(msg); } const ct = res.headers.get('content-type') || ''; return ct.includes('application/json') ? res.json() : null; }
    (function headerToggle(){ const t = getAccessToken(); const auth = document.getElementById('authLinks'); const newBtn = document.getElementById('newBtn'); if (auth) { if (t) { auth.innerHTML = `<a href="/profile" style="margin-right: 10px;">내 정보</a><a href="#" id="logoutBtn">로그아웃</a>`; if(newBtn) newBtn.style.display = 'inline-block'; } else { auth.innerHTML = `<a href="/login" style="margin-right: 10px;">로그인</a><a href="/signup">회원가입</a>`; if(newBtn) newBtn.style.display = 'none'; } } document.addEventListener('click', (e) => { if (e.target && e.target.id === 'logoutBtn') { e.preventDefault(); localStorage.removeItem('accessToken'); localStorage.removeItem('refreshToken'); location.reload(); } }); })();
</script>
</body>
</html>
