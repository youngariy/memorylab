<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <title>글 수정</title>
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; }
        nav { margin-bottom: 16px; }
        nav a { margin-right: 8px; }
        input, select, textarea { width:100%; padding:8px; border:1px solid #e5e7eb; border-radius:8px; }
        textarea { min-height: 240px; }
        .row { margin-bottom: 12px; }
    </style>
</head>
<body>
<nav class="nav">
    <a href="/">홈</a> |
    <a href="/board/list">게시판</a> |
    <a href="#" id="newLink">새 글</a> |
    <span id="authLinks"></span>
</nav>

<main>
    <h1>글 수정</h1>
    <form id="f">
        <div class="row">
            <input name="title" maxlength="120" required placeholder="제목">
        </div>
        <div class="row">
            <select name="category">
                <option value="">분류 없음</option>
                <option value="NOTICE">공지</option>
                <option value="FREE">자유</option>
                <option value="QNA">QnA</option>
            </select>
        </div>
        <div class="row">
            <select name="visibility">
                <option value="PUBLIC">전체공개</option>
                <option value="PRIVATE">나만보기</option>
            </select>
        </div>
        <div class="row">
            <textarea name="content" required placeholder="내용"></textarea>
        </div>
        <button type="submit">저장</button>
        <a id="cancel" href="#" style="margin-left:12px">취소</a>
    </form>
</main>

<script>
    const tokenKey = 'accessToken';
    const getToken = () => localStorage.getItem(tokenKey);

    async function api(path, {method='GET', headers={}, body, raw=false} = {}) {
        const h = {'Content-Type': 'application/json', ...headers};
        const t = getToken(); if (t) h['Authorization'] = 'Bearer ' + t;
        const res = await fetch(path, {method, headers: h, body});
        if (res.status === 401) { localStorage.removeItem(tokenKey); alert('로그인이 필요합니다.'); location.href = '/login'; throw new Error('Unauthorized'); }
        if (!res.ok) { const msg = await res.text().catch(()=> ''); throw new Error(msg || ('HTTP '+res.status)); }
        return raw ? res : res.json();
    }

    (function headerToggle(){
        const t = getToken();
        const auth = document.getElementById('authLinks');
        const newLink = document.getElementById('newLink');
        if (t) { if (auth) auth.innerHTML = `<a href="/profile">내 정보</a> | <a href="#" id="logoutBtn">로그아웃</a>`; if (newLink) newLink.href = '/board/new'; }
        else { if (auth) auth.innerHTML = `<a href="/login">로그인</a>`; if (newLink) newLink.href = '/login'; }
        if (newLink) newLink.style.display = 'none';
        document.addEventListener('click', (e) => { if (e.target && e.target.id === 'logoutBtn') { e.preventDefault(); localStorage.removeItem(tokenKey); location.reload(); } });
    })();

    if (!getToken()) { alert('로그인이 필요합니다.'); location.href = '/login'; }

    const $ = (s)=>document.querySelector(s);
    const id = new URLSearchParams(location.search).get('id');
    const f = $('#f');

    async function load(){
        const d = await api(`/api/board/${id}`);
        f.title.value = d.title || '';
        f.content.value = d.content || '';
        f.category.value = (d.category || '');
        f.visibility.value = (d.visibility || 'PUBLIC');
    }

    window.__dirty = false;
    f.addEventListener('input', ()=> { window.__dirty = true; });

    window.addEventListener('beforeunload', (evt) => { if (window.__dirty) { evt.preventDefault(); evt.returnValue = ''; } });
    document.addEventListener('click', (e)=>{
        if (!window.__dirty) return;
        const a = e.target.closest('a'); if (!a) return;
        if (a.target || a.href.startsWith('javascript:')) return;
        if (!confirm('변경 사항이 저장되지 않았습니다. 이동하시겠어요?')) e.preventDefault();
    });

    f.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const fd = new FormData(f);
        const payload = {
            title: (fd.get('title')||'').trim(),
            content: (fd.get('content')||'').trim(),
            category: (fd.get('category') || '').trim() || null,
            visibility: (fd.get('visibility') || 'PUBLIC').trim().toUpperCase()
        };
        await api(`/api/board/${id}`, {method:'PUT', body: JSON.stringify(payload)});
        window.__dirty = false;
        alert('저장되었습니다.');
        location.href = `/board/view?id=${encodeURIComponent(id)}`;
    });

    document.getElementById('cancel').addEventListener('click', (e)=>{
        e.preventDefault();
        if (window.__dirty && !confirm('변경 사항이 저장되지 않았습니다. 취소하시겠어요?')) return;
        location.href = `/board/view?id=${encodeURIComponent(id)}`;
    });

    load();
</script>
</body>
</html>
