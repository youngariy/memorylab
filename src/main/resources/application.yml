server:
  forward-headers-strategy: native

spring:
  application:
    name: memorylab
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 510MB
      file-size-threshold: 2MB

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      # ddl-auto를 none으로 설정하여 스키마 관리를 Flyway에 완전히 위임합니다.
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        transport.protocol: smtp
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        smtp.ssl.trust: smtp.gmail.com

app:
  mail:
    from: ${APP_MAIL_FROM:${SPRING_MAIL_USERNAME:}}
  upload:
    root-dir: /home/ec2-user/app/uploads/ # 프롬프트 요구사항 경로
    converted-base-url: /media/converted

  # --- FFmpeg/FFprobe 경로 설정 ---
  ffmpeg:
    path: ffmpeg
  ffprobe:
    path: ffprobe

  ai-server: # 트랜스코딩 관련 설정 (기존 유지)
    url: https://localhost:8081/api/v1/convert
    status-url: https://localhost:8081/api/v1/status/{boardId}
    secret-key: ${AI_SERVER_SECRET_KEY:"YOUR_SUPER_SECRET_KEY"} # 환경변수화
    timestamp-validity-sec: 300

  # --- 스케줄러 설정 ---
  scheduler:
    # 동영상 변환 스케줄러 (기존)
    conversion-rate-ms: 30000
    polling-rate-ms: 60000
    stale-threshold-minutes: 5
    max-retries: 3
    batch-size: 5
    concurrency: 3
    # 신규: 썸네일 생성 스케줄러
    thumbnail:
      rate-ms: 30000        # 실행 주기 (30초)
      batch-size: 10        # 한 번에 처리할 작업 수
      max-retries: 3        # 최대 재시도 횟수

jwt:
  secret: ${JWT_SECRET}
  access-token-minutes: 60

logging:
  level:
    org.springframework.security: DEBUG
    com.memorylab.service.ThumbnailService: DEBUG # ffmpeg 로그 확인용

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j.circuitbreaker:
  instances:
    ai-server:
      failure-rate-threshold: 50
      slow-call-duration-threshold: 10s
      slow-call-rate-threshold: 50
      wait-duration-in-open-state: 60s
      permitted-number-of-calls-in-half-open-state: 3
      sliding-window-type: COUNT_BASED
      sliding-window-size: 10
      minimum-number-of-calls: 5
