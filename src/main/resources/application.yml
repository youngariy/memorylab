server:
  forward-headers-strategy: native

spring:
  application:
    name: memorylab
  profiles:
    # 기본 프로필을 dev로 설정하여, 로컬 실행 시 application-dev.yml 설정을 사용하도록 유도
    default: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 510MB
      file-size-threshold: 2MB

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate # dev, prod 모두 validate 또는 none 권장
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret: ${JWT_SECRET:"DefaultJwtSecretKeyForDevelopmentEnvironmentOnly1234567890"}
  access-token-minutes: 60

logging:
  level:
    com.memorylab: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: INFO

# --- 3D 모델 변환(GPU 서버) 시스템 설정 ---
gpu-server:
  # GPU API 서버의 기본 주소입니다.
  base-url: "http://mlab-api.snowytiger.me"
  # GPU 서버에서 오는 웹훅 요청을 검증하기 위한 비밀 키입니다.
  webhook-secret: ${GPU_WEBHOOK_SECRET:"DefaultGpuWebhookSecretKeyForDev"}

file:
  storage:
    # 최종 PLY 파일이 저장될 서버의 절대 경로입니다.
    ply-base-path: "/srv/memorylab/uploads/ply"
    # 파일 다운로드 시 임시로 사용될 서버의 절대 경로입니다.
    tmp-path: "/srv/memorylab/tmp"
  download:
    # PLY 결과 파일 다운로드를 허용할 도메인 목록입니다.
    allowed-domains:
      - "mlab-api.snowytiger.me"
    # 다운로드를 시작하기 위해 필요한 최소 디스크 여유 공간(MB)입니다.
    min-free-space-mb: 100
